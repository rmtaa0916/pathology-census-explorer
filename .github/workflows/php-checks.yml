name: PHP checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint PHP source files
        run: |
          set -eu
          find src public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run deterministic data tests
        run: php -d zend.assertions=1 -d assert.exception=1 tests/CensusDataTest.php
      - name: Test selected and full-coverage formal reports
        run: php -d zend.assertions=1 -d assert.exception=1 tests/ReportBuilderTest.php
      - name: Test atomic PHP batch-edit planner and conflict checks
        run: php -d zend.assertions=1 -d assert.exception=1 tests/CensusBatchPlannerTest.php
      - name: Validate PHP-rendered browser UI, batch staging and printable reports
        run: node tests/FrontendReportTest.cjs
      - name: Reject accidental sensitive files
        run: |
          set -eu
          if find . -type f \( -name '.env' -o -name '*credentials*.json' -o -name '*.key' -o -name '*.xls' -o -name '*.xlsx' \) -not -path './.git/*' | grep .; then
            echo 'Unexpected secrets or laboratory workbook in repository'
            exit 1
          fi
